name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_sanity:
        description: Run exhaustive live Sanity browser compatibility tests
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Both sources share the same source graph and generated declarations.
      # Each source still builds below; see docs/test-coverage.md.
      - name: Check Astro and TypeScript
        run: npm run check:markdown

      - name: Run source-independent contracts
        run: npm run test:contracts

      - name: Upload contract Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-contracts
          path: |
            playwright-report/contracts/
            playwright-report/contracts.json
            test-results/contracts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Playwright builds the selected content source before starting its server.
      - name: Run browser regression tests from Markdown
        run: npm run test:markdown

      - name: Upload Markdown Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-markdown
          path: |
            playwright-report/markdown/
            playwright-report/markdown.json
            test-results/markdown/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Sanity integration tests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$FULL_SANITY" = "true" ]; then
            npm run test:sanity:full
          else
            npm run test:sanity
          fi
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          FULL_SANITY: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sanity }}

      - name: Note private Sanity checks skipped for fork
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Sanity-backed checks are skipped because GitHub does not expose repository secrets to forked pull requests."

      - name: Upload Sanity Playwright artifacts
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-sanity
          path: |
            playwright-report/sanity/
            playwright-report/sanity.json
            test-results/sanity/
            playwright-report/sanity-full/
            playwright-report/sanity-full.json
            test-results/sanity-full/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    # This action compares the pull request's dependency changes against the
    # GitHub Advisory Database. It is deliberately unavailable to push runs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
